  <!-- Right card -->
  <g transform="translate(760,140)">
    <rect width="376" height="280" rx="22" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <rect x="20" y="20" width="48" height="48" rx="12" fill="#F4C770" fill-opacity="0.14" stroke="#F4C770" stroke-opacity="0.3"/>
    <text x="44" y="48" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#F8D78D">✓</text>
    <text x="84" y="34" font-family="JetBrains Mono, monospace" font-size="9" fill="#F4DBA2" letter-spacing="0.1em">ZK PROOF</text>
    <text x="84" y="52" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#FFF9EF">total' = total + amount</text>
    <text x="84" y="68" font-family="Inter, sans-serif" font-size="9" fill="#B7C3DF">verified on-chain · amount stays private</text>
    <g transform="translate(20,92)">
      <rect width="168" height="26" rx="999" fill="#8BE0AF" fill-opacity="0.12" stroke="#8BE0AF" stroke-opacity="0.22"/>
      <text x="84" y="17" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#CFEEE0" letter-spacing="0.07em">PUBLIC: TOTAL</text>
    </g>
    <g transform="translate(196,92)">
      <rect width="160" height="26" rx="999" fill="#F4C770" fill-opacity="0.12" stroke="#F4C770" stroke-opacity="0.22"/>
      <text x="80" y="17" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#F4DBA2" letter-spacing="0.07em">PRIVATE: AMOUNT</text>
    </g>
