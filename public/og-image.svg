<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0B1020"/>
  <rect width="1200" height="630" fill="url(#g)"/>
  <defs>
    <radialGradient id="g" cx="88%" cy="0%" r="45%">
      <stop offset="0%" stop-color="#F4C770" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Brand -->
  <g transform="translate(64,48)">
    <rect width="52" height="52" rx="14" fill="#1a2438" stroke="#F4C770" stroke-opacity="0.42"/>
    <text x="26" y="31" text-anchor="middle" dominant-baseline="middle" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="700" fill="#F8D78D">M</text>
    <text x="68" y="18" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600" fill="#EDF3FF" letter-spacing="-0.02em">MidnightTrace</text>
    <text x="68" y="36" font-family="JetBrains Mono, monospace" font-size="9" fill="#D7A84A" letter-spacing="0.14em">MIDNIGHT NETWORK · PREPROD</text>
  </g>
  <!-- Headline -->
  <text x="64" y="210" font-family="Fraunces, Georgia, serif" font-size="54" font-weight="600" fill="#FFF9EF" letter-spacing="-0.03em">Prove work happened.</text>
  <text x="64" y="270" font-family="Fraunces, Georgia, serif" font-size="54" font-weight="600" fill="#F4C770" letter-spacing="-0.03em">Keep evidence private.</text>
  <text x="64" y="318" font-family="Inter, sans-serif" font-size="18" fill="#D7E0F3">Zero-knowledge proofs on Midnight — public audit, private amounts.</text>
  <!-- Pills -->
  <g transform="translate(64,350)">
    <rect width="145" height="28" rx="999" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.15"/>
    <text x="72.5" y="18" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#F5E8C9" letter-spacing="0.08em">SELECTIVE DISCLOSURE</text>
    <g transform="translate(157,0)">
      <rect width="125" height="28" rx="999" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.15"/>
      <text x="62.5" y="18" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#F5E8C9" letter-spacing="0.08em">PRIVATE ALLOWLIST</text>
    </g>
    <g transform="translate(294,0)">
      <rect width="105" height="28" rx="999" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.15"/>
      <text x="52.5" y="18" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#F5E8C9" letter-spacing="0.08em">PUBLIC AUDIT</text>
