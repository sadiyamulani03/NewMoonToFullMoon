    <text x="20" y="170" font-family="JetBrains Mono, monospace" font-size="8" fill="#8BE0AF" letter-spacing="0.06em">● All integrity checks passed</text>
  </g>
  <!-- Bottom bar -->
  <rect y="580" width="1200" height="50" fill="#F4C770"/>
  <text x="600" y="610" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="650" fill="#1C150B" letter-spacing="0.01em">Private forensics on Midnight · midnighttrace.vercel.app</text>
