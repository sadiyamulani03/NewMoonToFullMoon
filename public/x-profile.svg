<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="MidnightTrace X profile image">
  <title>MidnightTrace — X Profile</title>
  <defs>
    <radialGradient id="bg" cx="72%" cy="18%" r="78%">
      <stop offset="0%" stop-color="#1E2E4A"/>
      <stop offset="55%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#070A12"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C770" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8A93A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Circular container with safe padding for X circular crop (keep mark inside 84% diameter) -->
  <rect width="400" height="400" rx="200" fill="url(#bg)"/>
  <!-- subtle outer ring -->
  <circle cx="200" cy="200" r="196" fill="none" stroke="url(#ring)" stroke-width="1.2" opacity="0.9"/>
  <circle cx="200" cy="200" r="196" fill="none" stroke="white" stroke-opacity="0.07" stroke-width="1"/>
  <!-- inner glow -->
  <circle cx="238" cy="88" r="110" fill="#F4C770" opacity="0.07"/>
  <!-- Mark container: rounded square centered, sized for circular crop safety -->
  <g transform="translate(200,200)" filter="url(#shadow)">
    <rect x="-72" y="-72" width="144" height="144" rx="28" fill="#0F1A2E" stroke="#F4C770" stroke-opacity="0.38" stroke-width="1.4"/>
    <rect x="-72" y="-72" width="144" height="144" rx="28" fill="none" stroke="white" stroke-opacity="0.08"/>
    <!-- highlight top edge -->
    <path d="M -44 -72 H 44 Q 72 -72 72 -44 V -60 Q 72 -72 60 -72 Z" fill="white" opacity="0.06"/>
    <!-- M -->
    <text x="0" y="14" text-anchor="middle" dominant-baseline="middle" font-family="Fraunces, Georgia, serif" font-size="102" font-weight="700" fill="#F8D78D" letter-spacing="-0.04em">M</text>
    <!-- redacted bar accent under M — privacy motif, subtle -->
    <rect x="-38" y="46" width="76" height="7" rx="3.5" fill="#070A12" opacity="0.95"/>
    <rect x="-38" y="46" width="76" height="7" rx="3.5" fill="none" stroke="white" stroke-opacity="0.04"/>
    <!-- verified badge -->
    <g transform="translate(62,-56)">
      <circle r="22" fill="#3FA772" stroke="#0B1020" stroke-width="3.5"/>
      <path d="M -8 1 L -1.2 7.5 L 8.5 -6" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- Wordmark below mark — small, stays inside crop safe area -->
  <g text-anchor="middle">
    <text x="200" y="312" font-family="Fraunces, Georgia, serif" font-size="15.5" font-weight="700" fill="#F5EFE8" letter-spacing="-0.02em">MIDNIGHT<tspan font-weight="600" fill="#F4C770">TRACE</tspan></text>
    <text x="200" y="328" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="6.8" font-weight="600" fill="#8EA0BE" letter-spacing="0.18em">PRIVATE • VERIFIED • MIDNIGHT</text>
  </g>
</svg>
