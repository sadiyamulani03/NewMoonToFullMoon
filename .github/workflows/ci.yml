name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Compact compile + contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: level1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: level1/package-lock.json

      - name: Install Compact compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: '0.31.1'

      - run: npm ci

      - name: Compile the counter contract
        run: npm run compile:counter

      - name: Contract unit tests
        run: npm test

  frontend:
    name: Frontend build + smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: level2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: level2/package-lock.json

      - run: npm ci

      - name: Production build
        run: npm run build

      - name: Smoke test (verifies ZK assets ship in dist)
        run: node tests/smoke.mjs

      - name: API smoke test
        run: node tests/api-smoke.mjs